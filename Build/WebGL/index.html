<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Classic Slot Machine - WebGL Build & Outcome Simulator</title>
  <link rel="icon" type="image/png" href="assets/slot-symbol1.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0a0b16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      display: block;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #loading-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f59e0b;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
      margin-bottom: 20px;
    }

    .progress-bar-bg {
      width: 320px;
      height: 14px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      transition: width 0.2s ease;
    }

    #loading-text {
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }

    /* --- Simulator & Manual Controls Floating UI --- */
    #toggle-simulator-btn {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 50;
      background: rgba(30, 27, 75, 0.9);
      border: 1.5px solid #818cf8;
      color: #e0e7ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    #toggle-simulator-btn:hover {
      background: #4338ca;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    #simulator-panel {
      position: absolute;
      top: 14px;
      left: 16px;
      width: 440px;
      max-height: 680px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #818cf8;
      border-radius: 12px;
      padding: 16px 18px;
      z-index: 60;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 25px rgba(99, 102, 241, 0.25);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    #simulator-panel.hidden {
      display: none;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #close-simulator-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    #close-simulator-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 590px;
      padding-right: 2px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .bet-input-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    #manual-bet-input {
      width: 75px;
      height: 32px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    #manual-bet-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .step-btn, .chip-btn {
      height: 32px;
      padding: 0 9px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .step-btn:hover, .chip-btn:hover {
      background: #334155;
      color: #fff;
      border-color: #475569;
    }

    .chip-btn[data-bet="max"] {
      background: rgba(225, 29, 72, 0.2);
      border-color: #e11d48;
      color: #f43f5e;
    }

    .chip-btn[data-bet="max"]:hover {
      background: #e11d48;
      color: #fff;
    }

    .reels-select-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .reel-picker {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .reel-picker span {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
    }

    .reel-picker select {
      height: 32px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      padding: 0 4px;
      outline: none;
      cursor: pointer;
    }

    .reel-picker select:focus {
      border-color: #f59e0b;
    }

    .presets-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
    }

    .presets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .preset-btn {
      padding: 5px 9px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .preset-btn.reset-btn {
      background: rgba(56, 189, 248, 0.1);
      border-color: #0284c7;
      color: #38bdf8;
    }

    .preset-btn.reset-btn:hover {
      background: #0284c7;
      color: #fff;
    }

    /* Simulation Preview Card */
    .simulation-preview-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .preview-title {
      color: #94a3b8;
    }

    .preview-value {
      font-weight: 700;
      color: #f1f5f9;
    }

    .preview-value.highlight {
      color: #10b981;
      font-size: 12px;
      font-family: monospace;
    }

    #execute-simulation-btn {
      height: 40px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid #34d399;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }

    #execute-simulation-btn:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div id="loading-title">SLOT MACHINE</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div id="loading-text">Loading Assets...</div>
    </div>

    <!-- Toggle Button for Simulator & Manual Controls -->
    <button id="toggle-simulator-btn" title="Toggle Manual Outcome & Bet Controls">
      ⚙️ MANUAL CONTROLS & SIMULATOR
    </button>

    <!-- Manual Configuration & Payout Simulator Panel -->
    <div id="simulator-panel" class="hidden">
      <div class="panel-header">
        <div class="panel-title">🎯 OUTCOME SIMULATOR & MANUAL BET</div>
        <button id="close-simulator-btn">✕</button>
      </div>

      <div class="panel-body">
        <!-- Section 1: Manual Bet Amount -->
        <div class="panel-section">
          <label class="section-label">💰 MANUALLY SET BET AMOUNT</label>
          <div class="bet-input-row">
            <button class="step-btn" id="bet-minus-btn">-10</button>
            <input type="number" id="manual-bet-input" min="1" max="10000" value="10" />
            <button class="step-btn" id="bet-plus-btn">+10</button>
            <button class="chip-btn" data-bet="50">50</button>
            <button class="chip-btn" data-bet="100">100</button>
            <button class="chip-btn" data-bet="250">250</button>
            <button class="chip-btn" data-bet="max">MAX</button>
          </div>
        </div>

        <!-- Section 2: Winning Combinations & Manual Payouts -->
        <div class="panel-section">
          <label class="section-label">🎰 MANUALLY SET WINNING COMBINATION</label>
          <div class="reels-select-row">
            <div class="reel-picker">
              <span>Reel 1</span>
              <select id="reel1-select">
                <option value="random">🎲 Random</option>
                <option value="0">★ 7 (Seven)</option>
                <option value="1">✦ BAR</option>
                <option value="2">🔔 BELL</option>
                <option value="3">🍒 CHERRY</option>
              </select>
            </div>
            <div class="reel-picker">
              <span>Reel 2</span>
              <select id="reel2-select">
                <option value="random">🎲 Random</option>
                <option value="0">★ 7 (Seven)</option>
                <option value="1">✦ BAR</option>
                <option value="2">🔔 BELL</option>
                <option value="3">🍒 CHERRY</option>
              </select>
            </div>
            <div class="reel-picker">
              <span>Reel 3</span>
              <select id="reel3-select">
                <option value="random">🎲 Random</option>
                <option value="0">★ 7 (Seven)</option>
                <option value="1">✦ BAR</option>
                <option value="2">🔔 BELL</option>
                <option value="3">🍒 CHERRY</option>
              </select>
            </div>
          </div>

          <!-- Quick Combination Presets -->
          <div class="presets-label">QUICK WIN PRESETS:</div>
          <div class="presets-row">
            <button class="preset-btn" data-r1="0" data-r2="0" data-r3="0">★ 7-7-7 (100x Jackpot)</button>
            <button class="preset-btn" data-r1="1" data-r2="1" data-r3="1">✦ BAR-BAR-BAR (50x Mega)</button>
            <button class="preset-btn" data-r1="2" data-r2="2" data-r3="2">🔔 BELLs (25x + 5 Free Spins)</button>
            <button class="preset-btn" data-r1="3" data-r2="3" data-r3="3">🍒 3x Cherries (10x)</button>
            <button class="preset-btn" data-r1="3" data-r2="3" data-r3="0">🍒 2x Cherries (2x)</button>
            <button class="preset-btn" data-r1="0" data-r2="0" data-r3="3">⚡ Lucky Respin (7-7-Cherry)</button>
            <button class="preset-btn reset-btn" data-r1="random" data-r2="random" data-r3="random">🎲 Reset to Random</button>
          </div>
        </div>

        <!-- Section 3: Live Payout Simulation Preview -->
        <div class="simulation-preview-card">
          <div class="preview-row">
            <span class="preview-title">Target Combination:</span>
            <span id="preview-combo" class="preview-value">Random (RNG)</span>
          </div>
          <div class="preview-row">
            <span class="preview-title">Win Condition:</span>
            <span id="preview-condition" class="preview-value">Standard Play</span>
          </div>
          <div class="preview-row">
            <span class="preview-title">Simulated Payout:</span>
            <span id="preview-payout" class="preview-value highlight">+0 Coins</span>
          </div>
        </div>

        <!-- Action Button -->
        <button id="execute-simulation-btn">🎯 SIMULATE & SPIN TO THIS OUTCOME</button>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>

  <script src="game.js"></script>
</body>
</html>
